[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vissim-mcp"
version = "0.1.0"
description = "MCP server for PTV Vissim traffic simulation — bridge Claude AI to Vissim via COM automation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "XIANG XIE", email = "xiexiang924@outlook.com"}
]
keywords = ["vissim", "traffic-simulation", "mcp", "model-context-protocol", "com-automation", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "mcp[cli]>=1.0.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
ai = [
    "anthropic>=0.40",
]
com = [
    "pywin32>=305; platform_system == 'Windows'",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]
sumo = [
    "traci",
]

[project.scripts]
vissim-mcp = "vissim_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vissim_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
